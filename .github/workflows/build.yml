name: Build CYD App Platform

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Used by release.yml to build a release tag. Publishing lives in release.yml so
  # this workflow only ever needs read access.
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (for example refs/tags/v0.3.0)
        type: string
        required: true

permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build launcher and example apps
    runs-on: ubuntu-24.04
    # Pin an exact ESP-IDF release so builds are reproducible.
    container:
      image: espressif/idf:v5.4.2
    defaults:
      run:
        shell: bash
    env:
      # Compiler cache: most of the build is ESP-IDF itself, which rarely changes.
      IDF_CCACHE_ENABLE: 1
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 600M
      # Absolute paths differ between checkouts only by workspace; hash relative to it.
      CCACHE_BASEDIR: ${{ github.workspace }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          # Full history and tags so the firmware version is the release tag (e.g. v0.2.0).
          fetch-depth: 0

      - name: Trust the workspace for git
        # ESP-IDF calls `git describe` for the project version; inside a
        # container the checkout is owned by another user.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore compiler cache
        # Tag and pull-request builds can reuse the cache saved by main.
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-idf-v5.4.2-${{ github.sha }}
          restore-keys: ccache-idf-v5.4.2-

      - name: Make sure ccache is available
        run: command -v ccache || (apt-get update -qq && apt-get install -y -qq ccache)

      - name: Install PlatformIO for Arduino apps
        run: python3 -m pip install --user platformio

      - name: Add PlatformIO to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build launcher and apps
        run: |
          source "$IDF_PATH/export.sh"
          idf.py --version
          ccache --zero-stats
          ./tools/build.sh
          ccache --show-stats

      - name: Package the SD card folder
        run: cd dist/sd && python3 -m zipfile -c ../cyd-sd-card.zip apps

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cyd-app-platform
          path: dist/
          if-no-files-found: error
          retention-days: 14
