name: Build CYD App Platform

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build launcher and example apps
    runs-on: ubuntu-24.04
    # Pin an exact ESP-IDF release so builds are reproducible.
    container:
      image: espressif/idf:v5.4.2
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # Full history and tags so the firmware version is the release tag (e.g. v0.2.0).
          fetch-depth: 0

      - name: Trust the workspace for git
        # ESP-IDF calls `git describe` for the project version; inside a
        # container the checkout is owned by another user.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build launcher and apps
        run: |
          source "$IDF_PATH/export.sh"
          idf.py --version
          ./tools/build.sh

      - name: Package the SD card folder
        run: cd dist/sd && python3 -m zipfile -c ../cyd-sd-card.zip apps

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cyd-app-platform
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: cyd-app-platform
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cyd-launcher-full.bin
            dist/cyd-launcher.bin
            dist/cyd-launcher.json
            dist/cyd-sd-card.zip
            dist/SHA256SUMS
          generate_release_notes: true
